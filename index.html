<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محاكاة نتيجة الطلاب</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff; /* خلفية الصفحة بيضاء */
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start; /* يبدأ من الأعلى مثل المواقع الرسمية */
        }

        .container {
            background-color: #ffffff;
            width: 100%;
            max-width: 800px;
            padding: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse; /* دمج الحدود لتصبح خطوطاً موحدة */
            margin-top: 20px;
            background-color: #ffffff;
        }

        /* تنسيق الصف العلوي (العناوين) */
        th {
            background-color: #f2f2f2; /* رمادي فاتح جداً مثل الصورة */
            color: #000000; /* خط أسود */
            font-weight: bold;
            font-size: 16px;
            padding: 12px;
            border: 1px solid #000000; /* خطوط سوداء */
            text-align: center;
        }

        /* تنسيق خلايا البيانات */
        td {
            padding: 15px;
            border: 1px solid #000000; /* خطوط سوداء تماماً */
            text-align: center;
            color: #000000; /* خط أسود */
            font-size: 15px;
            background-color: #ffffff; /* جميع الصفوف بيضاء بدون تمويج */
        }
    </style>
</head>
<body>

<div class="container">
    
    <table>
        <thead>
            <tr>
                <th>كود المقرر</th>
                <th>المقرر باللغة العربية</th>
                <th>التقدير</th>
                <th>الحالة</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>E105</td>
                <td>قضايا فقهية معاصرة</td>
                <td>ض ج</td>
                <td>راسب</td>
            </tr>
            <tr>
                <td>E106</td>
                <td>تاريخ التشريع</td>
                <td>ض</td>
                <td>راسب</td>
            </tr>
            <tr>
                <td>E107</td>
                <td>مصطلح حديث</td>
                <td>ل</td>
                <td>ناجح</td>
            </tr>
        </tbody>
    </table>
</div>

</body>
</html>
